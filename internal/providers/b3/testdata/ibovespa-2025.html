<p><small>01/09/2025</small></p>
<p><b>São Paulo, 1º de setembro de 2025</b> – A B3 divulga a nova carteira do Ibovespa B3 que vai vigorar de 01/09/2025 a 02/01/2026, com base no fechamento do pregão de 29/08/2025, registra a entrada das empresas Cury (CURY3) e CEA Modas (CEAB3), e a saída da São Martinho (SMTO3) e PETZ (PETZ3).</p>
