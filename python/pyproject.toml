[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "invs-research"
version = "0.1.0"
description = "DuckDB helpers for point-in-time investment research"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
  "jupyterlab==4.6.3",
  "pandas==2.3.3",
  "pyarrow==21.0.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.5"]

[project.scripts]
invs-feature = "research.feature_cli:main"
invs-feature-quality = "research.feature_quality_cli:main"
invs-adjust = "research.adjustment_cli:main"
invs-bias-audit = "research.bias_audit_cli:main"
invs-backtest = "research.backtest_cli:main"
invs-paper = "research.paper_cli:main"
invs-forward-record = "research.forward_record_cli:main"
invs-release = "research.release_cli:main"
invs-workflow = "research.workflow_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
