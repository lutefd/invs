data_dir: ./data
user_agent: "invs/0.1 research@example.com"
http:
  timeout: 30s
  requests_per_second: 5
  burst: 1
  max_attempts: 4
  initial_backoff: 500ms
providers:
  sec:
    enabled: false
  prices:
    enabled: true
    start: 2020-01-01
  fred:
    enabled: true
    series: [DGS10, CPIAUCSL]
  alfred:
    enabled: false
    series:
      - id: CPIAUCSL
        geography: US
        unit: index_1982_1984_100
        frequency: monthly
        seasonal_adjustment: seasonally_adjusted
        # ALFRED requests always start at 1776-07-04 so row vintage dates are not clipped.
        realtime_end: 2026-08-11
        observation_start: 2018-01-01
        observation_end: 2026-07-01
  bcb:
    enabled: false
    series:
      - code: "432"
        geography: BR
        unit: percent
        frequency: daily
        seasonal_adjustment: not_adjusted
        start: 2020-01-01
  ptax:
    enabled: false
    # Inclusive, explicit, and bounded to at most 366 days per run.
    start: 2026-01-01
    end: 2026-12-31
  b3:
    enabled: false
    # B3 requests are explicit current/reference snapshots; do not omit the date.
    report_date: 2026-08-21
    tickers: []
    calendar:
      enabled: false
      year: 2026
      # B3 trading-hours HTML is current/reference evidence. Keep coverage
      # deliberately bounded to dates supported by the retained page version.
      coverage_start: 2026-08-24
      coverage_end: 2026-08-28
  b3_historical_prices:
    enabled: false
    # Closed annual COTAHIST files only. Canonical rows remain knowable from
    # local receipt time because the archive has no exact historical release time.
    year: 2021
    start: 2021-09-06
    end: 2021-09-10
    tickers: []
  nyse:
    enabled: false
    year: 2026
    coverage_start: 2026-01-01
    coverage_end: 2026-12-31
  nasdaq_membership:
    enabled: false
    universe_id: nasdaq_100
    tickers: []
    notices: []
  nasdaq_calendar_history:
    enabled: false
    year: 2025
    coverage_start: 2025-12-24
    coverage_end: 2025-12-26
    regular_open_local: "09:30"
    regular_close_local: "16:00"
    # Enabled historical calendars require exact official artifact hashes,
    # declared availability timestamps, and explicit exception transcriptions.
    versions: []
  b3_membership:
    enabled: false
    universe_id: ibovespa
    tickers: []
    notices: []
  b3_calendar_history:
    enabled: false
    year: 2026
    coverage_start: 2026-02-16
    coverage_end: 2026-02-18
    regular_open_local: "10:00"
    regular_close_local: "17:00"
    versions: []
  # Exact-hash action artifacts use declarative, source-located transcriptions.
  # SEC uses EDGAR acceptance time; B3 replay uses local receipt time only.
  sec_action_history:
    enabled: false
    availability_policy: source_publication
    resources: []
    actions: []
  b3_action_replay:
    enabled: false
    availability_policy: installation_receipt
    resources: []
    actions: []
  b3_listing_history:
    enabled: false
    notices: []
  cvm:
    enabled: false
    cad: true
    # IPE archive years are explicit; document URLs are never discovered here.
    ipe:
      years: [2025, 2026]
universe:
  - issuer_id: 1b3d88f5-55b8-4dc5-a6be-2f77e9e99201
    security_id: 469fc20f-7d4b-45bb-b827-05f8410e71aa
    legal_name: Apple Inc.
    country_code: US
    security_type: common_stock
    primary_listing: true
    cik: 320193
    ticker: AAPL
    identifier_valid_from: 1980-12-12
    yahoo_symbol: AAPL
    exchange: NASDAQ
    mic: XNAS
    currency: USD
